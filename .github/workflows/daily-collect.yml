# 每日增量采集：更新政策库并提交到 data 分支
# - main 分支只放代码；data/policy.sqlite 与 exports/ 由本 workflow 维护到 data 分支
# - GitHub 云端在墙外，OECD/UK 等源无需代理即可访问
# - cron 为 UTC 时间：01:00 UTC = 北京时间 09:00
name: daily-collect

on:
  schedule:
    - cron: "0 1 * * *"   # 每天北京时间 09:00
  workflow_dispatch: {}    # 支持在 Actions 页面手动触发

permissions:
  contents: write

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 检出 main 分支（代码）
        uses: actions/checkout@v4

      - name: 检出 data 分支（历史数据库）
        uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch
        continue-on-error: true   # data 分支不存在时不阻塞（首次部署前已在本地建好）

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 恢复数据库（从 data 分支）
        run: |
          mkdir -p data exports
          if [ -f data-branch/data/policy.sqlite ]; then
            cp data-branch/data/policy.sqlite data/policy.sqlite
            echo "已恢复 data 分支的数据库"
          else
            echo "data 分支无数据库，将新建"
          fi

      - name: RSS 增量 + 官方接口回填
        run: |
          python -m collector update
          python -m collector backfill govcn
          python -m collector backfill federal
          python -m collector backfill oecd

      - name: 导出与报告
        run: |
          python -m collector export || true
          python -m collector report || true

      - name: 收紧 SQLite（合并 WAL，便于单文件提交）
        run: python -c "import sqlite3; c=sqlite3.connect('data/policy.sqlite'); c.execute('PRAGMA wal_checkpoint(TRUNCATE)'); c.close()"

      - name: 提交到 data 分支
        run: |
          count=$(python -c "import sqlite3; print(sqlite3.connect('data/policy.sqlite').execute('SELECT COUNT(*) FROM policies').fetchone()[0])" || echo '?')
          mkdir -p data-branch/data data-branch/exports
          cp data/policy.sqlite data-branch/data/policy.sqlite
          cp exports/* data-branch/exports/ 2>/dev/null || true
          # exports 只保留最近几轮产物，防止仓库无限增长
          (cd data-branch/exports && ls -t | tail -n +10 | xargs -r rm -f)
          cd data-branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/policy.sqlite exports
          if git diff --cached --quiet; then
            echo "无新增数据，跳过提交"
          else
            git commit -m "每日采集 $(date -u +%Y-%m-%d) 总量 ${count} 条"
            git push
          fi
